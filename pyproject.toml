[project]
name = "agri-assistant"
version = "0.1.0"
description = "Voice-first multilingual agricultural assistant for Indian farmers (Hindi, Marathi, English)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "numpy>=2.1.0",
    "pymupdf>=1.24.0",
    "prometheus-client>=0.21.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
]

[project.optional-dependencies]
ml = [
    "faster-whisper>=1.0.3",
    "sentence-transformers>=3.2.0",
    "qdrant-client>=1.12.0",
    "edge-tts>=6.1.12",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
